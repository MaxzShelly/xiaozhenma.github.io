      - company: University of California, Irvine
        position: Project Leader — PIKAN-Drive
        location: Irvine, California, USA
        start_date: 2026-06
        end_date: present
        summary: Developed a progressive physics-informed KAN framework for end-to-end steering-angle regression, from PilotNet steering regression toward BEV trajectory planning.
        highlights:
          - Supervised by Prof. Fadi Kurdahi; compared PilotNet, MLP, KAN, and physics-informed KAN residual modules.
          - Preprocessed and chronologically partitioned 45,406 sequential driving samples from the Udacity self-driving dataset and established a unified training, testing, and model-preservation workflow.
          - Evaluated steering smoothness, steering-rate, and vehicle-state consistency constraints with MAE and RMSE.

      - company: Institute of Automation, Chinese Academy of Sciences
        position: Research Assistant — Intelligent CAD and Point-Cloud Geometry
        location: Beijing, China
        start_date: 2026-02
        end_date: present
        summary: Explored LLM-based intelligent CAD generation and point-cloud surface segmentation optimisation at the National Laboratory of Pattern Recognition.
        highlights:
          - Supervised by Prof. Dong-Ming Yan and Prof. Mingyang Zhao; evaluated a tool-augmented vision-language CAD workflow for task planning, code generation, geometric modelling, and execution-feedback correction.
          - Optimised prompts for CAD sketch constraints and parametric modelling using dimensional and geometric constraints.
          - Reproduced Point2CAD and ParSeNet, implemented their data-interface compatibility, and investigated three-axis projection boundary detection and geometric consistency.

      - company: Southwest Jiaotong University × University of Leeds
        position: Project Leader — 3D Railway Scene Reconstruction
        location: Chengdu, China
        start_date: 2025
        end_date: 2026-05
        summary: Developed the FrustumDense-SAM-XC3D railway-scene reconstruction system using multi-frame LiDAR, RGB images, and monocular depth.
        highlights:
          - Supervised by Prof. Zhao Tang; proposed multi-frame frustum back-projection densification for spatial aggregation across current, historical, and future frames.
          - Integrated DepthPro-based monocular metric depth with LiDAR pose constraints and semantic boundary information for dense 3D reconstruction.
          - Applied multi-frame object-boundary detection, occlusion handling, and co-visibility consistency checks for large-scale railway scenes.

      - company: Southwest Jiaotong University × University of Leeds
        position: Project Leader — Sparse Point-Cloud Reconstruction
        location: Chengdu, China
        start_date: 2024
        end_date: 2025
        summary: Investigated machine-learning-driven reconstruction of high-speed train head shapes from sparse LiDAR observations.
        highlights:
          - Supervised by Prof. Zhao Tang; participated in building a portable multi-sensor acquisition device using LiDAR, cameras, and IMUs.
          - Designed tri-axial projection, explicit hole-point generation, reverse hole-boundary reasoning, and multi-directional interpolation, improving model integrity from approximately 75% to 98%.
          - Independently authored the technical research report on sparse point-cloud train-head surface reconstruction.

