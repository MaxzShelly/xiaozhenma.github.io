    Experience:
      - company: University of California, Irvine
        position: "Project Lead — PIKAN-Drive: Progressive Physics-Informed KANs from PilotNet Steering Regression to Fast-BEV 3D Detection"
        location: Irvine, California, USA
        start_date: 2026-06
        end_date: present
        summary: Led a progressive study of MLP, KAN, and PI-KAN architectures from PilotNet steering regression to Fast-BEV multi-camera 3D detection, establishing unified training, evaluation, and ablation pipelines.
        highlights:
          - Built a PilotNet benchmark on 45,406 sequential Udacity samples; the best PI-KAN achieved MAE 3.209 and RMSE 6.163, reducing error by 11.3% and 9.7% relative to the MLP baseline.
          - Improved the Fast-BEV KAN baseline from 0.2559 to 0.2720 mAP and from 0.3950 to 0.4046 NDS.
          - Designed nine grouped physics-informed auxiliary losses and conducted targeted Fast-BEV ablations; additional constraints did not consistently improve detection, motivating task-specific, metric-aligned, and architecture-aware supervision.
          - Supervised by Prof. Fadi Kurdahi.

      - company: National Laboratory of Pattern Recognition, Institute of Automation, Chinese Academy of Sciences
        position: Research Assistant — Intelligent CAD Generation and Point-Cloud-to-Editable-CAD Reconstruction
        location: Beijing, China
        start_date: 2026-02
        end_date: present
        summary: Developed and evaluated tool-augmented CAD generation and point-cloud-to-parametric-CAD reconstruction workflows.
        highlights:
          - Deployed and evaluated CAD-Assistant for tool-augmented CAD generation through the FreeCAD Python API, analysing task planning, code generation, geometric modelling, and execution feedback; optimised prompts with dimensional and geometric constraints to improve code executability, solid validity, and parametric modelling quality.
          - Reproduced Point2CAD and ParSeNet, implemented data-interface compatibility between the two pipelines, and investigated multi-view and three-axis projection boundary constraints, showing that additional boundary supervision did not reliably improve the official segmentation baseline through comparative experiments.
          - Developed a CAD-Recode-based point-cloud-to-parametric-CAD pipeline, generating executable CadQuery programs from point-cloud inputs, executing and validating them through CadQuery and OpenCascade/OCP, and producing editable CAD programs together with B-Rep, STEP, and Solid outputs.
          - Designed and evaluated CAD-knowledge supervision, geometric verification, parameter refinement, structural diagnosis, and multi-candidate selection strategies; the independently confirmed S2@100 inference pipeline reduced median Chamfer Distance by 13.4% relative to S0@10 while also improving mean, P90, and mean IoU without reducing solid validity, establishing geometric candidate reranking as the strongest confirmed approach.
          - Supervised by Prof. Dong-Ming Yan and Prof. Mingyang Zhao.

      - company: State Key Laboratory of Rail Transit Vehicle System, Southwest Jiaotong University
        position: Project Lead — Sparse Point Cloud 3D Railway Scene Reconstruction Technology Driven by Monocular Depth Estimation
        location: Chengdu, China
        start_date: 2025-04
        end_date: 2026-05
        summary: Developed the FrustumDense-SAM-XC3D railway-scene 3D reconstruction system by integrating multi-frame LiDAR point clouds, RGB images, and monocular depth information into a pipeline covering point-cloud densification, depth fusion, object segmentation, occlusion handling, and scene visualization.
        highlights:
          - Proposed a multi-frame frustum back-projection densification method that projected LiDAR points from the current, historical, and future frames into the camera frustum for spatial aggregation, filling sparse regions around buildings, tracks, and trackside facilities to improve point-cloud coverage and structural completeness in large-scale scenes.
          - Integrated DepthPro-based monocular metric depth estimation with LiDAR pose constraints and applied patch-wise fitting, boundary resampling, and moving least-squares prediction to correct scale errors in distant regions of the monocular depth maps and generate pixel-level dense 3D point clouds.
          - Applied the pretrained SAM3 model to multi-frame image segmentation and object-boundary detection, used a tree-based data structure to manage nested objects and occlusion relationships, and implemented cross-frame co-visibility consistency checks for point-cloud matching, clustering, and unique object identification.
          - Designed class-aware radius filtering and patch-based rendering algorithms to suppress accumulated noise from multi-frame point-cloud fusion, extract tracks, buildings, and transportation facilities by category, and visualize large-scale railway scenes for single-frame object extraction and railway asset presentation.
          - Supervised by Prof. Zhao Tang.

      - company: State Key Laboratory of Rail Transit Vehicle System, Southwest Jiaotong University
        position: Project Lead — Sparse Point Cloud Completion and Surface Reconstruction of High-Speed Train Noses
        location: Chengdu, China
        start_date: 2024-04
        end_date: 2025-03
        summary: Built a portable point cloud acquisition system integrating LiDAR, a camera, and an IMU, and deployed FAST-LIVO2 for sensor fusion, pose estimation, and mapping.
        highlights:
          - Established a point-cloud processing pipeline using moving least squares for smoothing and geometric completion to address missing observations in glass-window regions.
          - Proposed a completion method combining tri-axial projection, section-based interpolation, and reverse hole-boundary identification to recover missing geometry from surrounding observations.
          - Compared greedy projection triangulation, Poisson reconstruction, and Marching Cubes-based reconstruction, examining window-region recovery, surface continuity, and overall shape preservation.
          - "Research output: Preprint posted on arXiv ([arXiv:2610.05758](https://arxiv.org/abs/2610.05758))."
          - Supervised by Prof. Zhao Tang.

