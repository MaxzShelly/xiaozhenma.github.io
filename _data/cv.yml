    Experience:
      - company: University of California, Irvine
        position: "Project Lead — PIKAN-Drive: Progressive Physics-Informed KANs from PilotNet Steering Regression to Fast-BEV 3D Detection"
        location: Irvine, California, USA
        start_date: 2026-06
        end_date: present
        summary: Led a progressive study of MLP, KAN, and PI-KAN architectures from PilotNet steering regression to Fast-BEV multi-camera 3D detection, establishing unified training, evaluation, and ablation pipelines.
        highlights:
          - Built a PilotNet benchmark on 45,406 sequential Udacity samples; the best PI-KAN achieved MAE 3.209 and RMSE 6.163, reducing error by 11.3% and 9.7% relative to the MLP baseline.
          - Improved the Fast-BEV KAN baseline from 0.2559 to 0.2720 mAP and from 0.3950 to 0.4046 NDS.
          - Designed nine grouped physics-informed auxiliary losses and conducted targeted Fast-BEV ablations; additional constraints did not consistently improve detection, motivating task-specific, metric-aligned, and architecture-aware supervision.
          - Supervised by Prof. Fadi Kurdahi.

      - company: National Laboratory of Pattern Recognition, Institute of Automation, Chinese Academy of Sciences
        position: Research Assistant — Intelligent CAD Generation and Point-Cloud-to-Editable-CAD Reconstruction
        location: Beijing, China
        start_date: 2026-02
        end_date: present
        summary: Developed and evaluated tool-augmented CAD generation and point-cloud-to-parametric-CAD reconstruction workflows.
        highlights:
          - Deployed and evaluated CAD-Assistant through the FreeCAD Python API; optimised prompts with dimensional and geometric constraints to improve code executability, solid validity, and parametric-modelling quality.
          - Reproduced Point2CAD and ParSeNet, implemented data-interface compatibility, and investigated multi-view and three-axis projection boundary constraints through comparative experiments.
          - Developed a CAD-Recode-based pipeline that generates executable CadQuery programs from point clouds, validates them through CadQuery and OpenCascade/OCP, and produces editable CAD programs with B-Rep, STEP, and Solid outputs.
          - Designed CAD-knowledge supervision, geometric verification, parameter refinement, structural diagnosis, and multi-candidate selection. The confirmed S2@100 pipeline reduced median Chamfer Distance by 13.4% relative to S0@10 while improving mean, P90, and mean IoU without reducing solid validity.
          - Supervised by Prof. Dong-Ming Yan and Prof. Mingyang Zhao.

      - company: State Key Laboratory of Rail Transit Vehicle System, Southwest Jiaotong University
        position: Project Lead — Sparse Point Cloud 3D Railway Scene Reconstruction Technology Driven by Monocular Depth Estimation
        location: Chengdu, China
        start_date: 2025-04
        end_date: 2026-05
        summary: Developed the FrustumDense-SAM-XC3D railway-scene reconstruction system using multi-frame LiDAR, RGB images, and monocular depth.
        highlights:
          - Integrated point-cloud densification, depth fusion, object segmentation, occlusion handling, and scene visualisation into a single pipeline.
          - Proposed multi-frame frustum back-projection densification across current, historical, and future frames to improve coverage and structural completeness around buildings, tracks, and trackside facilities.
          - Integrated DepthPro metric depth with LiDAR pose constraints, patch-wise fitting, boundary resampling, and moving least-squares prediction to correct distant-region scale errors and generate dense 3D point clouds.
          - Applied SAM3 to multi-frame image segmentation and object-boundary detection, with nested-object and occlusion management plus cross-frame co-visibility consistency checks.
          - Designed class-aware radius filtering and patch-based rendering to suppress fusion noise and visualise railway assets by category.
          - Supervised by Prof. Zhao Tang.

      - company: State Key Laboratory of Rail Transit Vehicle System, Southwest Jiaotong University
        position: Project Lead — Machine Learning-Driven 3D Reconstruction of High-Speed Train Head Shapes
        location: Chengdu, China
        start_date: 2024-04
        end_date: 2025-03
        summary: Investigated robust reconstruction of high-speed train heads from sparse point-cloud observations.
        highlights:
          - Constructed a portable multi-sensor acquisition device with LiDAR, cameras, and IMUs; developed a radar-vision tightly coupled SLAM framework based on FAST-LIVO2 with extended Kalman filtering for camera-pose optimisation.
          - Improved registration with enhanced ICP and dynamic-threshold denoising; generated uniform, high-precision point clouds through normal-vector estimation and resampling.
          - Introduced an incremental k-d tree for map storage and retrieval, plus motion-consistency-based dynamic-object exclusion for localisation robustness.
          - Proposed tri-axial projection segmentation interpolation and reverse hole-boundary identification, raising model integrity from 75% to 98%.
          - Explored Greedy triangulation, Poisson reconstruction, B-spline interpolation, Moving Cuboid, and radial-basis-function interpolation for complex surface modelling.
          - Independently authored the technical report Three-Dimensional Surface Reconstruction of High-Speed Train Noses from Sparse Point Clouds.
          - Supervised by Prof. Zhao Tang.

